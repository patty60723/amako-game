name: Update itch.io mobile preview

on:
  push:
    branches: [web-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amako-itch-mobile-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'patty60723/amako-game'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check one-time upload authorization
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo '::error::Setup required: add the itch.io butler credential as the BUTLER_API_KEY Actions secret. No game was uploaded.'
            exit 1
          fi
      - name: Check out runtime files only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-20
        with:
          persist-credentials: false
      - name: Validate and stage the tested runtime
        id: runtime
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          files = ['index.html','index.js','index.pck','index.wasm','index.png',
                   'index.audio.worklet.js','index.audio.position.worklet.js',
                   'OFL-NotoSansJP.txt','OFL-NotoSansTC.txt',
                   'media/hero-umbrella-inventory-v01.png','media/reply-side-cg-v01.png',
                   'media/NotoSansTC-Regular.ttf','version.json','robots.txt','.nojekyll']
          if (root / 'media/title-scene-v01.png').is_file():
              files.extend(['media/title-scene-v01.png','media/bag-watercolor-v01.png','media/settings-watercolor-v02.png'])
          # Optional reviewed chapter candidates live beside the unchanged root.
          candidate_names = {'index.html','index.js','index.pck','index.wasm','index.png',
                             'index.audio.worklet.js','index.audio.position.worklet.js',
                             'OFL.txt','OFL-NotoSansJP.txt','media/bag-watercolor-v01.png',
                             'media/hero-umbrella-inventory-v01.png','media/NotoSansTC-Regular.ttf',
                             'media/settings-watercolor-v02.png'}
          for manifest_path in sorted(root.glob('candidate-ch03-v*/runtime-manifest.json')):
              prefix = manifest_path.parent.name
              if not re.fullmatch(r'candidate-ch03-v\d+', prefix) or manifest_path.parent.is_symlink():
                  raise SystemExit('Invalid candidate directory')
              candidate = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              if set(candidate) != {'schema','status','build_tag','prefix','files'}:
                  raise SystemExit('Unexpected candidate metadata')
              if (candidate['schema'] != 'amako-runtime-candidate-v1' or candidate['status'] != 'Candidate'
                      or candidate['prefix'] != prefix or prefix != 'candidate-ch03-'+candidate['build_tag']
                      or not re.fullmatch(r'v\d+', candidate['build_tag'])):
                  raise SystemExit('Candidate manifest identity mismatch')
              rows = candidate['files']
              if len(rows) != len(candidate_names) or {r.get('path') for r in rows} != candidate_names:
                  raise SystemExit('Candidate runtime allowlist mismatch')
              for row in rows:
                  if set(row) != {'path','bytes','sha256'} or not re.fullmatch(r'[0-9a-f]{64}', str(row['sha256'])):
                      raise SystemExit('Invalid candidate hash record')
                  name = prefix+'/'+row['path']
                  source = root/name
                  if (source.is_symlink() or source.parent.is_symlink() or not source.is_file()
                          or source.stat().st_size >= 104857600 or source.stat().st_size != row['bytes']):
                      raise SystemExit('Invalid candidate runtime file: '+name)
                  if hashlib.sha256(source.read_bytes()).hexdigest() != row['sha256']:
                      raise SystemExit('Candidate hash mismatch: '+name)
                  files.append(name)
              files.append(prefix+'/runtime-manifest.json')
          allowed = set(files + ['.github/workflows/itch-preview.yml'])
          tracked = set(subprocess.check_output(['git','ls-files','-z']).decode().rstrip('\0').split('\0'))
          if tracked != allowed:
              raise SystemExit('Runtime branch has unexpected or missing files; refusing upload')
          version = json.loads(pathlib.Path('version.json').read_text(encoding='utf-8'))
          if not re.fullmatch(r'v\d+', version['version']):
              raise SystemExit('Invalid preview version')
          hasher = hashlib.sha256()
          with open('index.pck','rb') as pack:
              for block in iter(lambda: pack.read(1024 * 1024), b''):
                  hasher.update(block)
          digest = hasher.hexdigest()
          if digest != version['pck_sha256']:
              raise SystemExit('Game pack differs from verified version')
          for name in files:
              source = root / name
              if source.is_symlink() or not source.is_file() or source.stat().st_size > 200_000_000:
                  raise SystemExit('Invalid runtime file: '+name)
          if sum((root / name).stat().st_size for name in files) > 500_000_000:
              raise SystemExit('HTML5 package too large')
          for name in files:
              target = pathlib.Path('_site') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / name, target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version='+version['version']+'\n')
          print('Verified runtime '+version['version']+' '+digest)
      - name: Install checksum-pinned official itch.io uploader
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default -o "$RUNNER_TEMP/butler.zip"
          echo '2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5  '"$RUNNER_TEMP/butler.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" version
      - name: Update the existing itch.io HTML5 channel
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          PREVIEW_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          "$RUNNER_TEMP/butler/butler" push _site \
            patty60723/amako-private-demo:html5 --userversion "$PREVIEW_VERSION"
          echo 'Uploaded to the existing itch.io preview. On first channel upload, mark html5 as played in browser in Edit game.' >> "$GITHUB_STEP_SUMMARY"
