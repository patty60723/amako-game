name: Restore approved formal three-chapter release
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit creator-approved restoration action
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: amako-formal-release
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'patty60723/amako-game' && github.ref == 'refs/heads/web-preview' && inputs.approval == 'RESTORE-V690-APPROVED-A-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out restoration assets only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            candidate-ch03-v364
            candidate-review-v690
            media
      - name: Validate exact old assets and navigation-only wrapper
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,shutil,subprocess
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()=='9a86acd18cee17f1b14f1720dec0d43889e83b2f'
          raw=Path('formal-restoration-v723.json').read_bytes()
          assert sha(raw)=='c13b31606cb39c50c6b16f75de917c0bea131e7fdb751fb2395ccfc327c7d36e'
          m=json.loads(raw);assert m['schema']=='amako.formal-restoration/v723' and m['build']=='v690' and len(m['files'])==49
          nav=Path('formal_rollback_navigation_v723.js').read_bytes();assert sha(nav)==m['navigation_script_sha256'] and b'</script' not in nav.lower()
          dest=Path('_site');assert not dest.exists();dest.mkdir()
          for row in m['files']:
              p=Path(row['path']);assert not p.is_absolute() and '..' not in p.parts and 'v717' not in str(p)
              data=p.read_bytes();assert len(data)==row['bytes'] and sha(data)==row['sha256']
              if str(p)=='index.html':
                  marker=b'<meta charset="utf-8">';guard=b'async function openLatest() {'
                  assert data.count(marker)==1 and data.count(guard)==1
                  data=data.replace(marker,marker+b'<script>'+nav+b'</script>',1).replace(guard,guard+b"\n    if (window.amakoFormalRollbackNavigationV723?.status === 'failed') return;",1)
              assert sha(data)==row['served_sha256']
              target=dest/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          assert {p.relative_to(dest).as_posix() for p in dest.rglob('*') if p.is_file()}=={r['path'] for r in m['files']}
          assert sha((dest/'candidate-review-v690/index.pck').read_bytes())==m['pck_sha256']
          assert json.loads((dest/'preview-deployment.json').read_bytes())['review_prefix']=='candidate-review-v690'
          print(json.dumps({'restored':'v690','files':49,'root_sha256':m['served_root_sha256'],'navigation_only_compatibility':True}))
      - name: Install checksum-pinned official uploader
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default -o "$RUNNER_TEMP/butler.zip"
          echo '2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5  '"$RUNNER_TEMP/butler.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
      - name: Restore approved three-chapter formal content
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          test -n "$BUTLER_API_KEY"
          "$RUNNER_TEMP/butler/butler" push _site patty60723/amako-private-demo:html5 --userversion v690-restore-nav723
