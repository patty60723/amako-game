<!DOCTYPE html>
<html lang="zh-Hant">
	<head><meta name="robots" content="noindex,nofollow">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>雨子｜三章試玩</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		
	<style id="amako-native-reader-touch">body.amako-landscape{touch-action:auto}body.amako-landscape #amako-web-controls,body.amako-landscape #amako-web-controls.mail-window #amako-web-reading,#amako-ch02-ui #amako-ch02-letter-reading{touch-action:auto}</style><script id="amako-build-identity-bootstrap">// Read-only release label. The URL identifies a packaged review, never a save.
(() => {
  'use strict';
  const key = 'AmakoBuildIdentity';
  if (window[key]) return;
  const match = /(?:^|\/)candidate-review-v([0-9]+)\/index\.html$/.exec(location.pathname);
  if (!match) return;
  const release = 'v' + match[1], text = '試玩版 ' + release;
  const selector = '#amako-title-screen,.amako-settings-body';
  const labels = new Set(), owned = new WeakMap();
  const style = document.createElement('style');
  style.dataset.amakoBuildIdentity = 'style';
  style.textContent = `
.amako-build-identity{font-family:var(--amako-ui-font-family,inherit);font-size:12px;line-height:1.4;font-weight:400;letter-spacing:.03em;color:inherit;opacity:.72;pointer-events:none;user-select:none;white-space:nowrap}
#amako-title-screen>.amako-build-identity{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));max-width:calc(100% - 24px)}
#amako-title-screen.ar-settings>.amako-build-identity{display:none}
.amako-settings-body>.amako-build-identity{display:block;text-align:right;margin:4px 0 0}
`;
  (document.head || document.documentElement).append(style);
  function ensure(target) {
    if (!target.isConnected || !target.matches(selector)) return;
    const existing = owned.get(target);
    if (existing?.parentNode === target) { labels.add(existing); return; }
    const label = existing || document.createElement('small');
    label.className = 'amako-build-identity';
    label.dataset.amakoBuildIdentity = release;
    label.textContent = text;
    if (!existing) { owned.set(target, label); labels.add(label); }
    target.append(label);
  }
  function inspect(node) {
    if (!(node instanceof Element)) return;
    if (node.matches(selector)) ensure(node);
    for (const target of node.querySelectorAll(selector)) ensure(target);
  }
  for (const target of document.querySelectorAll(selector)) ensure(target);
  const observer = new MutationObserver(records => {
    // Do not retain destroyed settings roots through their detached labels.
    for (const label of labels) if (!label.isConnected) labels.delete(label);
    for (const record of records) {
      // Owners may replace children or destroy/recreate a settings view. Repair
      // only the affected owner/new subtree, never redraw or rescan the page.
      if (record.target instanceof Element && record.target.matches(selector)) ensure(record.target);
      for (const node of record.addedNodes) inspect(node);
    }
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  Object.defineProperty(window, key, { configurable: true, value: Object.freeze({
    release,
    dispose() {
      observer.disconnect();
      for (const label of labels) label.remove();
      labels.clear();style.remove();delete window[key];
    }
  }) });
})();
</script></head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":102410144,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const amakoBrowserShellTitle = document.title;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			document.title = amakoBrowserShellTitle;
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
