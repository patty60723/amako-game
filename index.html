<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>雨子</title>
<style>
html{color:#253844;background:#edf0ec;font-family:"Microsoft JhengHei",sans-serif}body{margin:0;min-height:100svh;display:grid;place-items:center}main{max-width:28rem;padding:24px;text-align:center}p{line-height:1.6}button{font:inherit;color:inherit;background:transparent;border:1px solid #8ca7b6;border-radius:4px;min-height:48px;padding:10px 24px;cursor:pointer}button:focus-visible{outline:3px solid #49616e;outline-offset:3px}[hidden]{display:none!important}
</style>
</head>
<body>
<main aria-live="polite"><p id="status">正在開啟雨子……</p><button id="retry" type="button" hidden>重新載入</button><noscript><p>請開啟 JavaScript，再重新載入此頁面。</p></noscript></main>
<script>
(() => {
  'use strict';
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  const base = new URL('./', location.href);
  let pending = false;
  async function openLatest() {
    if (pending) return;
    pending = true;
    retry.hidden = true;
    status.textContent = '正在開啟雨子……';
    try {
      const response = await fetch(new URL('preview-deployment.json', base), {cache: 'no-store', credentials: 'same-origin', mode: 'same-origin'});
      if (!response.ok) throw new Error('Manifest unavailable');
      const record = await response.json();
      if (!record || record.schema !== 'amako-runtime-deployment/v1' || typeof record.review_prefix !== 'string' || !/^candidate-review-v[0-9]+$/.test(record.review_prefix)) throw new Error('Invalid release');
      const path = record.review_prefix + '/index.html';
      if (!Array.isArray(record.files) || !record.files.includes(path)) throw new Error('Missing release');
      const target = new URL(path, base);
      if (target.origin !== location.origin || target.origin !== base.origin || target.pathname !== base.pathname + path || target.search || target.hash) throw new Error('Invalid target');
      location.replace(target.href);
    } catch (_) {
      status.textContent = '目前無法開啟遊戲，請重新載入。';
      retry.hidden = false;
    } finally {
      pending = false;
    }
  }
  retry.addEventListener('click', openLatest);
  openLatest();
})();
</script>
</body>
</html>
